<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="t d">
<title id="t">apiary-mock: startup and request pipeline</title>
<desc id="d">At startup cli.ts parses flags, the openapi module loads the spec, resolves local refs and mounts operations, and createMockServer starts a node:http server. Each request is read and its JSON body parsed, then delayed or failed by --delay and --fail-rate, matched against scenarios, routed, validated against the spec, and answered with a response selected by --prefer and generated from the schema with a seeded PRNG.</desc>
