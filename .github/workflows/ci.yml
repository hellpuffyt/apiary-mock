name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Test (Node ${{ matrix.node }} on ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  quality:
    name: "Lint, typecheck, and build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: "Lint"
        run: npx eslint .
      - name: "Typecheck (expected: no errors)"
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  smoke:
    name: "Smoke test the built CLI against the example spec"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Start, probe and exercise the server inside a single step. GitHub runs
      # each `run:` block in its own shell, so a process backgrounded in one
      # step is not reliably alive in the next -- which is why probing from a
      # separate step timed out even though the server starts correctly.
      - name: "Exercise the built CLI end to end"
        run: |
          set -u
          node dist/cli.js --spec examples/petstore.yaml \
            --scenarios examples/scenarios.yaml --port 4010 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          # Poll rather than sleep: fail fast with the server log when it dies.
          ready=""
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null "http://127.0.0.1:4010/pets"; then
              ready=yes
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "server exited before becoming ready"
              cat server.log
              exit 1
            fi
            sleep 0.5
          done
          if [ -z "$ready" ]; then
            echo "server did not become ready within 20s"
            cat server.log
            exit 1
          fi

          valid=$(curl -s -o valid.json -w "%{http_code}" \
            "http://127.0.0.1:4010/pets?status=available")
          echo "valid request -> $valid"
          cat valid.json
          if [ "$valid" -lt 200 ] || [ "$valid" -ge 300 ]; then
            echo "expected a 2xx status, got $valid"
            cat server.log
            exit 1
          fi

          invalid=$(curl -s -o invalid.json -w "%{http_code}" \
            "http://127.0.0.1:4010/pets?status=not-a-real-status")
          echo "invalid request -> $invalid"
          cat invalid.json
          if [ "$invalid" -lt 400 ] || [ "$invalid" -ge 500 ]; then
            echo "expected a 4xx status, got $invalid"
            cat server.log
            exit 1
          fi

          echo "smoke test passed"
