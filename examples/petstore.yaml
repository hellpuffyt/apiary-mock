openapi: 3.0.3
info:
  title: Petary — Example Pet Store API
  version: 1.0.0
  description: >
    A small example API used to exercise apiary-mock: nested and circular $refs,
    enums, formats, required fields, and multiple response shapes.
servers:
  - url: http://localhost:4010
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A page of pets
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    minItems: 0
                    maxItems: 5
                    items:
                      $ref: "#/components/schemas/Pet"
                  total:
                    type: integer
                    minimum: 0
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "409":
          description: Conflict — a pet with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPet
      summary: Get a pet by id
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePet
      summary: Delete a pet by id
      responses:
        "204":
          description: Deleted
components:
  schemas:
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        parent:
          $ref: "#/components/schemas/Category"
    NewPet:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        tag:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        status:
          type: string
          enum: [available, pending, sold]
        acquiredAt:
          type: string
          format: date-time
    Pet:
      allOf:
        - $ref: "#/components/schemas/NewPet"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    Error:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
          enum: [NOT_FOUND, CONFLICT, VALIDATION_ERROR]
